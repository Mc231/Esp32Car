<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Rover Control</title>
<style>
  :root {
    --bg: #0b1020; --bg-elev: #131a30; --bg-card: #1a2240;
    --border: #2a345a; --text: #e7ebf5; --text-dim: #8a93b3;
    --accent: #5b8cff; --accent-2: #8a5bff;
    --success: #3ddc84; --warning: #ffb454; --error: #ff6b6b;
    --shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f3f5fb; --bg-elev:#fff; --bg-card:#fff; --border:#e2e6f0; --text:#161a2b; --text-dim:#5e6680; --shadow:0 8px 24px rgba(20,30,60,.10); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    color: var(--text);
    background: radial-gradient(1200px 600px at 50% -10%, rgba(91,140,255,.15), transparent), var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; max-height: 100dvh; }

  header.bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg-elev); z-index: 10;
  }
  .back-btn {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .back-btn svg { width: 17px; height: 17px; }
  .back-btn:active { transform: scale(.94); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; min-width: 0; }
  .brand .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
  .stats { display: flex; gap: 6px; flex: 1; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim);
    padding: 5px 9px; border-radius: 999px; font-size: 12px; line-height: 1;
  }
  .pill b { color: var(--text); font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); display: inline-block; }
  .dot.ok { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .dot.warn { background: var(--warning); }
  .dot.err { background: var(--error); }

  .icon-btn {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; width: 36px; height: 36px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn:active { transform: scale(.94); }

  .stage {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  .stage img.cam {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    display: block;
  }
  .stage .cam-fallback {
    color: var(--text-dim); font-size: 13px; padding: 16px; text-align: center;
  }
  .overlay-stat {
    position: absolute;
    background: rgba(10,15,32,.62);
    color: #fff;
    padding: 6px 10px; border-radius: 8px;
    font-size: 12px; line-height: 1; backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .overlay-stat.tl { top: 12px; left: 12px; }
  .overlay-stat.tr { top: 12px; right: 12px; }
  .overlay-stat.bl { bottom: 12px; left: 12px; }
  .overlay-stat.br { bottom: 12px; right: 12px; }
  .overlay-stat b { font-weight: 700; }

  .controls {
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 16px; padding: 14px;
    background: var(--bg-elev); border-top: 1px solid var(--border);
    align-items: center;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
  }
  .dpad button {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none;
  }
  .dpad button:active, .dpad button.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .dpad button svg { width: 22px; height: 22px; }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .stop  { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }

  .mid { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .speed-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  .speed-row label { font-size: 12px; color: var(--text-dim); }
  .speed-row input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; background: var(--border); border-radius: 4px; }
  .speed-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-elev); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .speed-row input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-elev); }
  .speed-row .value { color: var(--text-dim); font-size: 12px; min-width: 32px; text-align: right; }

  .telemetry { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  .tel .k { display: block; font-size: 11px; color: var(--text-dim); }
  .tel .v { display: block; font-size: 13px; font-weight: 600; margin-top: 2px; }

  .side-actions { display: flex; flex-direction: column; gap: 8px; position: relative; }
  .icon-btn.rec.recording { color: var(--error); border-color: var(--error); }
  .icon-btn.rec.recording svg { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .icon-btn.replaying { color: var(--accent); border-color: var(--accent); }
  .rec-badge {
    position: absolute; top: -6px; right: -6px;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 700; line-height: 18px; text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }

  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow);
    font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s;
    z-index: 60; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--error); color: var(--error); }
  .toast.success { border-color: var(--success); color: var(--success); }

  @media (max-width: 720px) {
    .controls { grid-template-columns: 1fr; gap: 14px; }
    .side-actions { flex-direction: row; justify-content: flex-end; }
    .dpad { justify-self: center; }
    .stats .pill { display: none; }
    .stats .pill.always { display: inline-flex; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="back-btn" id="backBtn" title="Back" aria-label="Back to rovers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <div class="brand">
      <span class="name" id="roverName">Rover</span>
    </div>
    <div class="stats">
      <span class="pill always" id="connPill"><span class="dot" id="connDot"></span><b id="connText">…</b></span>
      <span class="pill"><span>Up</span><b id="upText">—</b></span>
      <span class="pill"><span>Heap</span><b id="heapText">—</b></span>
    </div>
  </header>

  <section class="stage" id="stage">
    <img id="cameraStream" class="cam" alt="">
    <div class="cam-fallback" id="camFallback" hidden>Camera stream unavailable</div>
    <div class="overlay-stat tl" id="distStat"><b>—</b> cm</div>
    <div class="overlay-stat tr" id="speedStat">PWM <b>0</b></div>
    <div class="overlay-stat bl" id="motorStatL">L: —</div>
    <div class="overlay-stat br" id="motorStatR">R: —</div>
  </section>

  <section class="controls">
    <div class="dpad" id="dpad">
      <button data-act="forward" class="up"   aria-label="Forward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
      </button>
      <button data-act="left" class="left" aria-label="Turn left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button data-act="stop" class="stop" aria-label="Stop">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button data-act="right" class="right" aria-label="Turn right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button data-act="backward" class="down" aria-label="Backward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>

    <div class="mid">
      <div class="speed-row">
        <label for="speed">Speed</label>
        <input type="range" id="speed" min="0" max="255" value="160">
        <span class="value" id="speedVal">160</span>
      </div>
      <div class="telemetry">
        <div class="tel"><span class="k">Distance</span><span class="v" id="telDist">—</span></div>
        <div class="tel"><span class="k">Uptime</span><span class="v" id="telUp">—</span></div>
        <div class="tel"><span class="k">Free heap</span><span class="v" id="telHeap">—</span></div>
        <div class="tel"><span class="k">IP</span><span class="v" id="telIp">—</span></div>
      </div>
    </div>

    <div class="side-actions">
      <button class="icon-btn rec" id="recordBtn" title="Start recording" aria-label="Record moves">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
      </button>
      <button class="icon-btn" id="replayBtn" title="Replay reversed" aria-label="Replay reversed" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
      </button>
      <button class="icon-btn" id="rebootBtn" title="Reboot rover" aria-label="Reboot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15A9 9 0 1 1 18 5.36"/>
        </svg>
      </button>
      <span class="rec-badge" id="recBadge" hidden>0</span>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ---------- Resolve rover from URL ----------
  const params = new URLSearchParams(location.search);
  const host = params.get('host');
  const name = params.get('name') || host || 'Rover';
  if (!host) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#8a93b3;font-family:sans-serif">No rover specified. <a href="index.html" style="color:#5b8cff">Pick one</a>.</div>';
    return;
  }
  $('roverName').textContent = name;

  // Camera stream uses port 81 (esp_camera default).
  $('cameraStream').src = 'http://' + host + ':81/stream';
  $('cameraStream').onerror = () => {
    $('cameraStream').hidden = true;
    $('camFallback').hidden = false;
  };

  $('backBtn').addEventListener('click', () => location.href = 'index.html');

  // ---------- State ----------
  const state = {
    host,
    speed: 160,
    online: false,
    ws: null,
    pending: new Map(),  // resolve callbacks per pending command (FIFO)
    pollTimer: null,
    reconnectTimer: null,
  };

  // ---------- Move recording / reverse-replay ----------
  // While recording.active is true, every press/release of a direction button
  // gets stored as { action, duration }. When the user hits replay, we walk
  // the list backwards with each direction inverted (forward<->backward,
  // left<->right) so the rover unwinds back to (approximately) its start.
  // Pumping keepalive sends every 700ms keeps the rover's deadman happy
  // for moves longer than the deadman timeout.
  const recording = {
    active: false,
    moves: [],
    pressStart: 0,
    pressAction: null,
  };
  const replay = {
    active: false,
    abort: false,
  };
  const REVERSE = { forward: 'backward', backward: 'forward', left: 'right', right: 'left' };
  function reverseAction(act) { return REVERSE[act] || act; }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg, kind = '') {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show ' + kind;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.className = 'toast', 2200);
  }

  function setOnline(ok) {
    state.online = ok;
    $('connDot').className = 'dot ' + (ok ? 'ok' : 'err');
    $('connText').textContent = ok ? 'Online' : 'Offline';
  }

  // ---------- WebSocket transport ----------
  // We send {command: "...", ...} messages and queue resolvers in FIFO order.
  // The server replies with a single message per request, with either a
  // `response` or `status` key. There's no request id in the protocol, so
  // ordering relies on the server replying in receive order (it does today).
  function connect() {
    const url = 'ws://' + host + ':32232/';
    console.log('[ws] connecting to', url);
    const ws = new WebSocket(url);
    state.ws = ws;
    ws.onopen = () => {
      console.log('[ws] open');
      setOnline(true);
      // The rover boots with motor PWM = 0, so set_motor commands flip the
      // H-bridge but the motors don't physically spin. Push the slider's
      // current value as soon as we connect so the very first move actually
      // moves.
      applySpeed(state.speed, 2);
      // Kick off telemetry polling once connected.
      startPolling();
      loadStaticInfo();
    };
    ws.onclose = ev => {
      console.warn('[ws] close — code=' + ev.code + ' reason="' + ev.reason + '" wasClean=' + ev.wasClean);
      setOnline(false);
      stopPolling();
      state.ws = null;
      // Reject any in-flight requests so callers see an error rather than hang.
      state.pending.forEach(cb => { try { cb({ error: 'disconnected' }); } catch {} });
      state.pending.clear();
      // Auto-reconnect with simple backoff.
      clearTimeout(state.reconnectTimer);
      state.reconnectTimer = setTimeout(connect, 2000);
    };
    ws.onerror = e => { console.error('[ws] error', e); };
    ws.onmessage = ev => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) {
        console.warn('[ws] non-JSON message:', ev.data);
        return;
      }
      const resolver = state.pending.size ? state.pending.entries().next().value : null;
      if (resolver) {
        const [key, cb] = resolver;
        state.pending.delete(key);
        cb(msg);
      } else {
        console.log('[ws] msg with no pending resolver:', msg);
      }
    };
  }

  // Log every outgoing command so we can correlate with disconnects.
  const _send_orig = null;

  function send(payload, expectsReply = true) {
    return new Promise((resolve, reject) => {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
        reject(new Error('not connected'));
        return;
      }
      if (expectsReply) {
        const key = Symbol();
        state.pending.set(key, msg => resolve(msg));
        // Safety timeout so a missed reply doesn't wedge the queue.
        setTimeout(() => {
          if (state.pending.has(key)) {
            state.pending.delete(key);
            reject(new Error('timeout'));
          }
        }, 4000);
      } else {
        resolve(null);
      }
      try {
        const text = JSON.stringify(payload);
        console.log('[ws] >>', text);
        state.ws.send(text);
      } catch (e) { console.error('[ws] send threw', e); reject(e); }
    });
  }

  // ---------- Telemetry polling ----------
  function fmtUptime(s) {
    s = Math.max(0, parseInt(s) || 0);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    if (h) return h + 'h ' + m + 'm';
    if (m) return m + 'm ' + ss + 's';
    return ss + 's';
  }
  function fmtBytes(n) {
    n = parseInt(n) || 0;
    if (n >= 1024 * 1024) return (n / 1048576).toFixed(2) + ' MB';
    if (n >= 1024) return (n / 1024).toFixed(1) + ' KB';
    return n + ' B';
  }
  const ACTION_LABEL = { 0: 'F', 1: 'B', 2: 'S' };

  async function pollOnce() {
    try {
      const sysMsg = await send({ command: 'system' });
      const distMsg = await send({ command: 'distance' });
      const motMsg = await send({ command: 'motor_state' });

      const sys = sysMsg?.response || {};
      const up = fmtUptime(sys.up_time);
      const heap = fmtBytes(sys.free_heap);
      $('upText').textContent = up;
      $('telUp').textContent  = up;
      $('heapText').textContent = heap;
      $('telHeap').textContent  = heap;

      const dist = distMsg?.response || {};
      if (dist.last_distance != null && dist.last_distance >= 0) {
        const cm = parseFloat(dist.last_distance).toFixed(1);
        $('telDist').textContent = cm + ' cm';
        $('distStat').innerHTML = '<b>' + cm + '</b> cm';
      } else {
        $('telDist').textContent = '—';
        $('distStat').innerHTML  = '<b>—</b> cm';
      }

      const mot = motMsg?.response || {};
      $('motorStatL').textContent = 'L: ' + (ACTION_LABEL[mot.lma] || '?') + ' ' + (mot.lmpwm ?? 0);
      $('motorStatR').textContent = 'R: ' + (ACTION_LABEL[mot.rma] || '?') + ' ' + (mot.rmpwm ?? 0);
    } catch (e) {
      // Ignore — onclose will trigger reconnect path.
    }
  }
  function startPolling() {
    stopPolling();
    pollOnce();
    state.pollTimer = setInterval(pollOnce, 1000);
  }
  function stopPolling() {
    if (state.pollTimer) clearInterval(state.pollTimer);
    state.pollTimer = null;
  }

  // ---------- One-shot static info (Wi-Fi IP) ----------
  async function loadStaticInfo() {
    try {
      const wifi = await send({ command: 'wifi' });
      const ip = wifi?.response?.ip || host;
      $('telIp').textContent = ip;
    } catch {}
  }

  // ---------- Motor commands ----------
  // action: 0 forward, 1 backward, 2 stop. motor: 0 left, 1 right, 2 both.
  function motor(action, m) {
    return send({ command: 'set_motor', action, motor: m }).catch(() => {});
  }
  function applySpeed(v, m) {
    // PWM must be sent as a number — the rover's WS handler parses it with
    // `j["pwm"].get<int>()` which throws on string values.
    const motors = m === 2 ? [0, 1] : [m];
    motors.forEach(mm => {
      send({ command: 'set_motor_pwm', motor: mm, pwm: parseInt(v, 10) }).catch(() => {});
    });
  }

  function dispatch(act) {
    if (act === 'forward')  return motor(0, 2);
    if (act === 'backward') return motor(1, 2);
    if (act === 'stop')     return motor(2, 2);
    if (act === 'left')     { motor(2, 0); return motor(0, 1); }
    if (act === 'right')    { motor(2, 1); return motor(0, 0); }
  }

  // ---------- D-pad bindings ----------
  const buttons = document.querySelectorAll('.dpad button');
  let heldAction = null;
  let keepaliveTimer = null;
  function startKeepalive(act) {
    heldAction = act;
    clearInterval(keepaliveTimer);
    keepaliveTimer = setInterval(() => { if (heldAction) dispatch(heldAction); }, 700);
  }
  function stopKeepalive() {
    heldAction = null;
    clearInterval(keepaliveTimer);
    keepaliveTimer = null;
  }
  const releaseAll = () => {
    buttons.forEach(b => b.classList.remove('active'));
    stopKeepalive();
    motor(2, 2);
  };

  // Hooks the recorder into a physical press/release. Manual control during
  // a replay aborts it.
  function onPress(act) {
    if (replay.active) cancelReplay();
    if (recording.active && act !== 'stop') {
      recording.pressStart = performance.now();
      recording.pressAction = act;
    }
  }
  function onRelease(act) {
    if (recording.active && recording.pressAction === act && recording.pressStart) {
      const duration = Math.round(performance.now() - recording.pressStart);
      recording.pressStart = 0;
      recording.pressAction = null;
      // Filter sub-100ms taps — likely mis-clicks, not intentional moves.
      if (duration >= 100) {
        recording.moves.push({ action: act, duration });
        updateRecordingUI();
      }
    }
  }

  // Track which buttons are actually held down so spurious pointerleave
  // events (hover without click) don't fire releases that send phantom stops.
  const heldButtons = new Set();
  buttons.forEach(btn => {
    const act = btn.dataset.act;
    const press = e => {
      e.preventDefault();
      if (heldButtons.has(act)) return;  // already pressed; ignore double-fire
      heldButtons.add(act);
      console.log('[btn] press', act);
      btn.classList.add('active');
      onPress(act);
      dispatch(act);
      if (act !== 'stop') startKeepalive(act);
    };
    const release = e => {
      e.preventDefault();
      if (!heldButtons.has(act)) return;  // never pressed → ignore
      heldButtons.delete(act);
      console.log('[btn] release', act);
      btn.classList.remove('active');
      onRelease(act);
      if (act !== 'stop') { stopKeepalive(); motor(2, 2); }
    };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });

  // ---------- Keyboard ----------
  const keyMap = { ArrowUp: 'forward', ArrowDown: 'backward', ArrowLeft: 'left', ArrowRight: 'right', ' ': 'stop' };
  const pressed = new Set();
  document.addEventListener('keydown', e => {
    const act = keyMap[e.key];
    if (!act || pressed.has(e.key)) return;
    pressed.add(e.key);
    e.preventDefault();
    document.querySelector('.dpad .' + ({forward:'up',backward:'down',left:'left',right:'right',stop:'stop'}[act]))?.classList.add('active');
    onPress(act);
    dispatch(act);
    if (act !== 'stop') startKeepalive(act);
  });
  document.addEventListener('keyup', e => {
    if (!keyMap[e.key]) return;
    pressed.delete(e.key);
    const act = keyMap[e.key];
    document.querySelector('.dpad .' + ({forward:'up',backward:'down',left:'left',right:'right',stop:'stop'}[act]))?.classList.remove('active');
    onRelease(act);
    if (act !== 'stop') { stopKeepalive(); motor(2, 2); }
  });
  window.addEventListener('blur', releaseAll);

  // ---------- Recording / replay controls ----------
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function updateRecordingUI() {
    const recBtn   = $('recordBtn');
    const replayBtn = $('replayBtn');
    const badge    = $('recBadge');
    recBtn.classList.toggle('recording', recording.active);
    recBtn.title = recording.active ? 'Stop recording' : 'Start recording';
    replayBtn.classList.toggle('replaying', replay.active);
    replayBtn.disabled = recording.active || replay.active || recording.moves.length === 0;
    if (recording.moves.length > 0) {
      badge.hidden = false;
      badge.textContent = String(recording.moves.length);
    } else {
      badge.hidden = true;
    }
  }

  function startRecording() {
    if (replay.active) return;
    recording.active = true;
    recording.moves = [];
    recording.pressStart = 0;
    recording.pressAction = null;
    updateRecordingUI();
    toast('Recording moves…');
  }

  function stopRecording() {
    recording.active = false;
    // If a button is currently held when stop is hit, finalise that move.
    if (recording.pressAction && recording.pressStart) {
      const duration = Math.round(performance.now() - recording.pressStart);
      if (duration >= 100) recording.moves.push({ action: recording.pressAction, duration });
      recording.pressStart = 0;
      recording.pressAction = null;
    }
    updateRecordingUI();
    toast('Recorded ' + recording.moves.length + ' move' + (recording.moves.length === 1 ? '' : 's'),
          recording.moves.length > 0 ? 'success' : '');
  }

  $('recordBtn').addEventListener('click', () => {
    if (recording.active) stopRecording();
    else startRecording();
  });

  // Long-press the record button to clear the recording without starting
  // a new one. Mobile-friendly alternative to a separate "trash" button.
  let recHoldTimer = null;
  $('recordBtn').addEventListener('pointerdown', () => {
    clearTimeout(recHoldTimer);
    recHoldTimer = setTimeout(() => {
      if (recording.moves.length > 0 && confirm('Clear recorded moves?')) {
        recording.active = false;
        recording.moves = [];
        updateRecordingUI();
        toast('Recording cleared');
      }
    }, 700);
  });
  $('recordBtn').addEventListener('pointerup',    () => clearTimeout(recHoldTimer));
  $('recordBtn').addEventListener('pointerleave', () => clearTimeout(recHoldTimer));

  function cancelReplay() {
    if (!replay.active) return;
    replay.abort = true;
    motor(2, 2);
    toast('Replay cancelled');
  }

  // Drives a single move for `durationMs`, pumping keepalive sends every
  // 700ms so the rover's deadman doesn't auto-stop us mid-move.
  async function executeReplayMove(act, durationMs) {
    dispatch(act);
    let elapsed = 0;
    const TICK = 700;
    while (elapsed < durationMs && !replay.abort) {
      const wait = Math.min(TICK, durationMs - elapsed);
      await sleep(wait);
      elapsed += wait;
      if (elapsed < durationMs && !replay.abort) dispatch(act);
    }
    motor(2, 2);
  }

  async function startReplay() {
    if (replay.active || recording.active || recording.moves.length === 0) return;
    replay.active = true;
    replay.abort = false;
    updateRecordingUI();
    toast('Replaying ' + recording.moves.length + ' moves in reverse…');

    // Walk the list backwards, inverting each direction.
    const sequence = [...recording.moves].reverse();
    for (const move of sequence) {
      if (replay.abort || !state.online) break;
      await executeReplayMove(reverseAction(move.action), move.duration);
      // Brief settle pause between moves so the rover physically stops
      // before the next direction kicks in.
      if (!replay.abort) await sleep(200);
    }

    motor(2, 2);
    replay.active = false;
    updateRecordingUI();
    if (!replay.abort) toast('Replay finished', 'success');
  }

  $('replayBtn').addEventListener('click', () => {
    if (replay.active) cancelReplay();
    else startReplay();
  });

  // Initial UI sync.
  updateRecordingUI();

  // ---------- Speed slider ----------
  $('speed').addEventListener('input', e => {
    state.speed = parseInt(e.target.value);
    $('speedVal').textContent = state.speed;
    $('speedStat').innerHTML = 'PWM <b>' + state.speed + '</b>';
  });
  $('speed').addEventListener('change', e => applySpeed(state.speed, 2));

  // ---------- Reboot ----------
  $('rebootBtn').addEventListener('click', () => {
    if (!confirm('Reboot the rover?')) return;
    send({ command: 'reboot' }, false).catch(() => {});
    toast('Rebooting…', 'success');
    setOnline(false);
  });

  // ---------- Initial paint ----------
  $('speedVal').textContent = state.speed;
  $('speedStat').innerHTML = 'PWM <b>' + state.speed + '</b>';
  setOnline(false);
  connect();
})();
</script>
</body>
</html>
