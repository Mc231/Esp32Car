<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1f">
<title>Rovers</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/picker.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="10" rx="2"/>
        <circle cx="7.5" cy="18" r="1.6"/>
        <circle cx="16.5" cy="18" r="1.6"/>
        <path d="M7 8V5h10v3"/>
      </svg>
    </div>
    <div>
      <h1>Rovers</h1>
      <div class="subtitle">Pick a rover to control</div>
    </div>
  </header>

  <div class="card" style="margin-bottom:18px">
    <div class="section-label">Saved rovers</div>
    <div class="rover-list" id="roverList"></div>
    <div class="empty" id="emptyMsg" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="10" rx="2"/>
        <circle cx="7.5" cy="18" r="1.6"/>
        <circle cx="16.5" cy="18" r="1.6"/>
        <path d="M7 8V5h10v3"/>
      </svg>
      <div>No rovers yet. Add one below.</div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Add a rover</div>
    <form class="add-form" id="addForm" autocomplete="off">
      <input id="addName" type="text" placeholder="Name (e.g. Garage rover)" required>
      <input id="addHost" type="text" placeholder="IP or hostname (e.g. 192.168.1.42)" required>
      <button class="btn-primary" type="submit">Add</button>
    </form>
  </div>
</div>

<script type="module" src="js/picker.js"></script>
</body>
</html>
