[platformio]
default_envs = wrover-cam

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
board_build.filesystem = spiffs
lib_deps =
    espressif/esp32-camera
    https://github.com/pidpawel/json.git
    WiFi
    WiFiClientSecure
    Links2004/WebSockets@^2.3.6
build_unflags = -std=gnu++11
build_flags = -std=gnu++2a

; Optional: OTA upload over Wi-Fi instead of serial.
; Use with `pio run -e ota -t upload`. Keep the default env for serial flashing.
[env:ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = Rover.local
; If you set adminPassword in main.cpp and want OTA-protected uploads:
; upload_flags = --auth=YOUR_PASSWORD

; ESP32-WROVER-DEV dev board with separate OV2640 daughter board (WROVER_KIT pin map).
; Module is real ESP32-WROVER-E: GPIO16/17 are consumed by PSRAM and not usable as GPIO.
; Camera occupies: 4, 5, 18, 19, 21, 22, 23, 25, 26, 27, 34, 35, 36, 39.
; Hardware change vs AI-Thinker: move L298N ENA wire from IO4 to IO32.
[env:wrover-cam]
extends = env:esp32cam
board = esp-wrover-kit
build_flags =
    ${env:esp32cam.build_flags}
    -DCAMERA_MODEL_WROVER_KIT
    -DROVER_BOARD_WROVER_CAM
    -DBOARD_HAS_PSRAM

; WROVER-CAM with BLE control + MQTT bridge enabled in addition to the
; existing WS/HTTP control surface. Adds NimBLE-Arduino + PubSubClient.
; Costs ~150 KB flash and ~15 KB RAM vs the lean wrover-cam env, plus a
; ~10-30% MJPEG framerate hit when a BLE central is actively connected.
; Configure broker host + BLE PIN in the captive portal Advanced section.
; MQTT-only flavour: keeps camera + WS + WiFi, adds an MQTT bridge.
; Plain TCP (no TLS), broker configured via captive portal Advanced.
[env:wrover-cam-mqtt]
extends = env:wrover-cam
build_flags =
    ${env:wrover-cam.build_flags}
    -DROVER_FEATURE_MQTT
lib_deps =
    ${env:esp32cam.lib_deps}
    knolleary/PubSubClient@^2.8

; Full flavour: BLE control surface + MQTT bridge. The bluetooth controller
; collides with esp_camera I2S in IRAM on arduino-esp32 v2.x — we work
; around it by dropping the camera in this env. Use this when you need
; out-of-WiFi BLE control or MQTT but don't need the live video stream.
[env:wrover-ble-mqtt-no-cam]
extends = env:wrover-cam
build_flags =
    ${env:wrover-cam.build_flags}
    -DROVER_FEATURE_BLE
    -DROVER_FEATURE_MQTT
    -DROVER_NO_CAMERA
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<../lib/RoverApplication/src/Camera/>
lib_deps =
    https://github.com/pidpawel/json.git
    WiFi
    Links2004/WebSockets@^2.3.6
    h2zero/NimBLE-Arduino@^1.4.1
    knolleary/PubSubClient@^2.8