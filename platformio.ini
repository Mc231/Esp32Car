[platformio]
default_envs = wrover-cam
test_dir = test

; Host (native) test env. `pio test -e native` runs Unity tests on the
; dev machine — no flash, no device. Used for the pure-logic firmware
; modules (TransportRegistry, etc.). Hardware-touching code (transports,
; managers) needs on-device tests instead.
[env:native]
platform = native
test_framework = unity
test_build_src = false
build_src_filter = -<*>
lib_ignore = RoverApplication
lib_deps =
    https://github.com/pidpawel/json.git
; Stubs come FIRST on the include path so our test-time Log/RemoteLogger.h
; (and Arduino.h) is found before the real one — the real RemoteLogger
; pulls in WiFi.h which doesn't exist on the host. UNITY_EXCLUDE_FLOAT is
; harmless and dodges Unity's isnan/isinf macros colliding with libc++'s
; <cmath>.
build_flags =
    -std=gnu++2a
    -I test/native_stubs
    -I lib/RoverApplication/src
    -DUNITY_EXCLUDE_FLOAT
    -DUNITY_EXCLUDE_DOUBLE

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
board_build.filesystem = spiffs
lib_deps =
    espressif/esp32-camera
    https://github.com/pidpawel/json.git
    WiFi
    Links2004/WebSockets@^2.3.6
build_unflags = -std=gnu++11
build_flags = -std=gnu++2a

; Optional: OTA upload over Wi-Fi instead of serial.
; Use with `pio run -e ota -t upload`. Keep the default env for serial flashing.
[env:ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = Rover.local
; If you set adminPassword in main.cpp and want OTA-protected uploads:
; upload_flags = --auth=YOUR_PASSWORD

; ESP32-WROVER-DEV dev board with separate OV2640 daughter board (WROVER_KIT pin map).
; Module is real ESP32-WROVER-E: GPIO16/17 are consumed by PSRAM and not usable as GPIO.
; Camera occupies: 4, 5, 18, 19, 21, 22, 23, 25, 26, 27, 34, 35, 36, 39.
; Hardware change vs AI-Thinker: move L298N ENA wire from IO4 to IO32.
; Distance sensor (Sharp GP2Y0A21 IR) on IO33.
[env:wrover-cam]
extends = env:esp32cam
board = esp-wrover-kit
build_flags =
    ${env:esp32cam.build_flags}
    -DCAMERA_MODEL_WROVER_KIT
    -DROVER_BOARD_WROVER_CAM
    -DBOARD_HAS_PSRAM
    -DROVER_FEATURE_DISTANCE

; WROVER-CAM with MQTT bridge enabled alongside the WS/HTTP control surface.
; Plain TCP (no TLS). Broker host/credentials configured via
; RoverApplicationConfig in src/main.cpp.
[env:wrover-cam-mqtt]
extends = env:wrover-cam
build_flags =
    ${env:wrover-cam.build_flags}
    -DROVER_FEATURE_MQTT
lib_deps =
    ${env:esp32cam.lib_deps}
    knolleary/PubSubClient@^2.8
